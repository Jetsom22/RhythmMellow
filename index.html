<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RhythmMellow</title>
<style>
html,body{margin:0;height:100%;background:#101114;color:#e8e6df;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#101114}
#overlay>div{display:grid;gap:12px;justify-items:center}
button{font:inherit;padding:12px 28px;background:#e8e6df;color:#101114;border:0;border-radius:2px;cursor:pointer}
button.ghost{background:none;color:#8a8880;padding:6px 12px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"><div><button id="start">시작</button></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
